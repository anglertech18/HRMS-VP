function topbar(){let route=getRoute(),name=routeTitles[route];return `<header class="topbar"><div class="top-left"><button class="icon-btn mobile-nav" data-action="sidebar" aria-label="Open navigation">${icon('menu',18)}</button><div class="crumb"><span>${crumbSection(route)}</span>${icon('chevron',13)}<strong>${esc(name)}</strong></div><button class="top-search" data-action="jump">${icon('search',16)} Search people, workflows, reviews... <span class="kbd">/</span></button></div><div class="top-right">${badge('<span class="badge-dot"></span> Demo environment','blue')}<button class="icon-btn" data-action="jump" aria-label="Quick navigation">${icon('spark',17)}</button><select class="role-select" id="role-select" aria-label="Preview user role">${Object.keys(roleLabel).map(k=>`<option value="${k}" ${state.role===k?'selected':''}>${roleLabel[k]}</option>`).join('')}</select><div class="avatar">${state.role==='vp'?'VP':state.role==='maker'?'MK':'HR'}</div></div></header>`}
function publicLayout(inner){return `<div class="public-wrap"><header class="public-top"><div class="public-brand"><span class="brand-logo">HR</span><b>HR People</b></div><div class="inline">${badge('<span class="badge-dot"></span> Candidate portal','blue')}${navBtn('View internal prototype','/screening/sessions','btn btn-sm only-desktop')}</div></header>${inner}<footer class="public-footer">HR People · Candidate experience demonstration only · No real interview, verification, or document submission occurs.</footer></div>`}
function render(){const route=getRoute();const rendered=page(route);$('#app').innerHTML=publicRoutes.has(route)?publicLayout(rendered):`<div class="app-shell">${sidebar()}<div class="main-shell">${topbar()}<main class="workarea">${rendered}</main></div></div>`;document.title=`${routeTitles[route]} | HR People Prototype`}
function page(route){switch(route){
case '/screening/sessions':return screeningSessions();case '/screening/create':return screeningCreate();case '/screening/triage':return screeningTriage();case '/screening/scorecard':return screeningScorecard();case '/screening/architecture':return architecture('screening');
case '/screening/admission':return screeningAdmission();case '/screening/verify':return screeningVerify();case '/screening/live':return screeningLive();
case '/prejoining/workspace':return lcWorkspace();case '/prejoining/dossier':return dossier();case '/prejoining/approvals':return approvals();case '/prejoining/links':return linksPage();case '/prejoining/handoff':return handoff();case '/prejoining/architecture':return architecture('prejoining');case '/prejoining/external':return externalPortal();default:return screeningSessions();}}
function jumpModal(){setModal('Quick navigate','Choose one of the redesigned screens.',`<div class="stack">${Object.keys(routeTitles).filter(r=>!publicRoutes.has(r)).map(r=>`<button class="list-row clickable" data-nav="${r}">${icon(r.startsWith('/screening')?'mic':'users',15)}<span style="flex:1;text-align:left;font-size:12px">${esc(routeTitles[r])}</span>${icon('arrow',15)}</button>`).join('')}</div>`,actionBtn('Close','close-modal'))}
function setModal(title,sub,body,footer=''){modalKey=title;$('#modal-root').innerHTML=`<div class="modal-backdrop" data-modal-backdrop="true"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div><button class="icon-btn" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div>${body}${footer?`<div class="modal-footer">${footer}</div>`:''}</section></div>`}
function closeModal(){modalKey=null;$('#modal-root').innerHTML=''}
function toast(message){$('#toast-root').innerHTML=`<div role="status" class="toast">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',3400)}
function field(label,id,placeholder='',type='text',val='',help='',req=false){return `<div class="field"><label for="${id}">${esc(label)} ${req?'<span class="req">*</span>':''}</label><input id="${id}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(val)}" ${req?'required':''} />${help?`<span class="help">${help}</span>`:''}</div>`}
function fieldSelect(label,id,options,selected=''){return `<div class="field"><label for="${id}">${esc(label)}</label><select id="${id}">${options.map(o=>{let v=typeof o==='string'?o:o.value,txt=typeof o==='string'?o:o.label;return `<option value="${esc(v)}" ${selected===v?'selected':''}>${esc(txt)}</option>`}).join('')}</select></div>`}
function progress(value=60){return `<div class="progress-track"><i style="width:${Math.min(100,Math.max(0,value))}%"></i></div>`}
function screeningSessions(){let all=sessions.filter(s=>(state.stageFilter==='all'||s.status===state.stageFilter)&&[s.name,s.role,s.email,s.channel].join(' ').toLowerCase().includes(state.search.toLowerCase()));let columns=[['queue','Invited & scheduled','blue'],['live','Live interview','green'],['analysis','AI processing','purple'],['ready','HR review ready','amber']];return `${header('Screening operations','Create interviews, monitor live sessions, and see exactly what needs attention next. Decisions happen in Screening Triage.','AI Screening / Operations',navBtn(icon('eye',15)+' Candidate journey','/screening/admission')+navBtn(icon('plus',16)+' New screening','/screening/create','btn btn-primary'))}
<div class="info-strip">${icon('info',18)}<div><strong>Operations and decisions are separate.</strong> The workflow progresses from invite → interview → AI evaluation → HR triage. AI analysis never automatically selects a candidate.</div></div>
<div class="metric-grid">${metric('All screening sessions',sessions.length,'Cross-channel pipeline','users')}${metric('Interview queue',sessions.filter(x=>x.status==='queue').length,'Invited and waiting','calendar')}${metric('Active / processing',sessions.filter(x=>['live','analysis'].includes(x.status)).length,'Live or evaluation in progress','mic','purple')}${metric('Ready for HR review',sessions.filter(x=>x.status==='ready').length,'Requires a human decision','clipboard','amber')}</div>
<div class="card toolbar"><label class="search-field">${icon('search')}<input id="ops-search" type="search" placeholder="Search candidate, role, or email..." value="${esc(state.search)}" aria-label="Search sessions" /></label><select id="ops-status" class="select" aria-label="Filter sessions by stage"><option value="all">All stages</option>${columns.map(([k,v])=>`<option value="${k}" ${state.stageFilter===k?'selected':''}>${v}</option>`).join('')}</select><div class="segmented"><button data-action="ops-board" class="${state.opsView==='board'?'active':''}">${icon('grid',13)} Board</button><button data-action="ops-table" class="${state.opsView==='table'?'active':''}">${icon('list',13)} Table</button></div>${actionBtn(icon('refresh',14)+' Reset','ops-reset','btn btn-sm')}</div>
${state.opsView==='board'?`<div class="lane-grid">${columns.map(([stage,label,tone])=>`<section class="lane"><div class="lane-head">${label}<em>${all.filter(s=>s.status===stage).length}</em></div><div class="lane-bar ${tone}"></div>${all.filter(s=>s.status===stage).length?all.filter(s=>s.status===stage).map(s=>sessionMini(s)).join(''):`<div class="empty-mini">No sessions in this stage</div>`}</section>`).join('')}</div>`:`<section class="card table-scroll"><table class="data-table"><thead><tr><th>Candidate</th><th>Role</th><th>Channel</th><th>Stage</th><th>When</th><th>Next</th></tr></thead><tbody>${all.map(s=>`<tr data-action="open-session" data-id="${s.id}"><td><b>${esc(s.name)}</b><div class="help">${esc(s.email)}</div></td><td>${esc(s.role)}</td><td>${badge(s.channel,'blue')}</td><td>${badge(stageName(s.status),stageTone(s.status))}</td><td>${esc(s.when)}</td><td><span class="tone-purple strong">Open ${icon('arrow',13)}</span></td></tr>`).join('')}</tbody></table></section>`}
<div class="section-bar"><h2>Explore the candidate experience</h2><span>Standalone, responsive public pages</span></div><div class="grid-3">${previewCard('Applicant admission','Secure, informed consent before screening starts.','user','/screening/admission')}${previewCard('Email verification','Token-aware verification and safe error states.','shield','/screening/verify')}${previewCard('Live audio interview','Focused AI interview desk with privacy cues.','headphones','/screening/live')}</div>`}
function sessionMini(s){return `<button class="session-card" data-action="open-session" data-id="${s.id}"><div class="between">${badge(s.channel==='Telephony'?'PHONE':s.channel.toUpperCase(),s.channel==='Telephony'?'purple':'blue')}${badge(stageName(s.status),stageTone(s.status))}</div><div class="inline" style="margin-top:13px"><span class="avatar-small">${s.initials}</span><div style="min-width:0"><div class="session-name">${esc(s.name)}</div><div class="session-role">${esc(s.role)}</div></div></div><div class="session-meta"><span>${esc(s.when)}</span><span style="color:#285eee">View ${icon('arrow',13)}</span></div></button>`}
function previewCard(title,desc,ic,to){return `<div class="card card-pad"><div class="metric-icon">${icon(ic,19)}</div><h3 class="card-title" style="margin-top:13px">${title}</h3><p class="card-sub" style="min-height:33px">${desc}</p><div style="margin-top:16px">${navBtn('Open prototype '+icon('arrow',13),to,'btn btn-sm')}</div></div>`}
function screeningCreate(){return `${header('Create screening session','A focused three-part flow replaces the oversized single-column form. Keep configuration reuse and candidate entry intact.','AI Screening / New Session',navBtn(icon('back',15)+' Back to sessions','/screening/sessions'))}
<div class="grid-60-40"><section class="card card-pad"><div class="card-head"><div><h2 class="card-title">1. Interview configuration</h2><p class="card-sub">Select a pre-approved screening pipeline.</p></div>${badge('STEP 1 OF 3','blue')}</div><div class="field-grid">${fieldSelect('Screening configuration','new-config',['Web / Full Stack Developer','Telephony / QA Automation','Hybrid / DevOps Engineer'],'Web / Full Stack Developer')}${fieldSelect('Interview channel','new-channel',['Web','Telephony','Hybrid'],'Web')}<div class="full checkbox-group"><input type="checkbox" id="new-referral"><label for="new-referral" class="tiny">Employee referral intake</label></div></div><hr class="rule"><div class="card-head"><div><h2 class="card-title">2. Candidate information</h2><p class="card-sub">Information used for verification and invitations.</p></div>${badge('REQUIRED FIELDS','')}</div><div class="field-grid">${field('Candidate full name','new-name','e.g. Neha Kapoor','text','','',true)}${field('Candidate email','new-email','name@example.com','email','','',true)}${field('Candidate phone (optional)','new-phone','+91 ...','tel')}${fieldSelect('Source','new-source',['Direct application','Employee referral','HR uploaded resume','Career website'])}<div class="full"><label class="doc-upload" for="new-resume">${icon('upload',20)}<strong>Attach resume (optional)</strong><small>PDF or DOCX · Prototype attachment only</small><input id="new-resume" type="file" accept=".pdf,.doc,.docx" style="display:none"></label><div id="resume-name" class="help" style="margin-top:5px"></div></div></div><hr class="rule"><div class="card-head"><div><h2 class="card-title">3. Candidate admission</h2><p class="card-sub">An invitation sends the candidate to verification and consent.</p></div></div><label class="checkbox-line"><input id="new-consent" type="checkbox"><span>I confirm the candidate may receive an interview invitation using the contact information above.</span></label><div class="between" style="margin-top:22px"><span class="help">No real email or call will be sent.</span>${actionBtn('Create demo session '+icon('arrow',16),'create-session','btn btn-primary btn-lg')}</div></section>
<aside class="stack"><div class="card card-pad"><h3 class="card-title">How this fits the existing HRMS</h3><p class="card-sub">The frontend already supports screening configurations, referral intake, resume attachment, and channel-specific creation.</p><hr class="rule"><div class="stack">${simpleStatus('1','Configuration selected','Use the existing approved pipeline.')}${simpleStatus('2','Candidate linked','Resolve duplicate profiles before entry.')}${simpleStatus('3','Invitation initiated','Issue access from the backend and log the event.')}</div></div><div class="info-strip amber">${icon('shield',19)}<div><strong>Identity and token integrity</strong><br>Only the production backend should issue verification/session credentials. This prototype never creates secure access tokens.</div></div></aside></div>`}
function simpleStatus(num,title,desc){return `<div class="status-card"><div class="status-icon"><strong>${num}</strong></div><div><h4>${title}</h4><p>${desc}</p></div></div>`}
function screeningAdmission(){return `<main class="public-content"><div class="public-split"><section><span class="eyebrow">${icon('spark',15)} AI-ASSISTED RECRUITMENT</span><h1 class="public-title">Welcome to your screening interview.</h1><p class="public-sub">We’ll verify your email, explain how this interview works, and help you join when you're ready. The hiring decision will always be made by a person.</p><div class="card card-pad" style="margin-top:26px"><h3 class="card-title">Your interview at a glance</h3><div class="info-tiles" style="margin-top:18px"><div class="info-tile"><span>ROLE</span><strong>Full Stack Developer</strong></div><div class="info-tile"><span>CHANNEL</span><strong>${icon('monitor',13)} Web voice interview</strong></div><div class="info-tile"><span>DURATION</span><strong>~20–30 minutes (estimate)</strong></div><div class="info-tile"><span>REQUIREMENTS</span><strong>Quiet area · Microphone</strong></div></div></div><div class="status-card" style="margin-top:15px"><div class="status-icon">${icon('shield',19)}</div><div><h4>Transparency and consent</h4><p>Your responses may be transcribed and evaluated to support recruitment. You can review the privacy notice before proceeding.</p></div></div></section>
<section class="public-card"><div class="between">${badge('STEP 1 OF 3','blue')}${badge('PRIVATE ADMISSION')}</div><h2 class="card-title" style="font-size:19px;margin:15px 0 7px">Confirm your details</h2><p class="card-sub" style="margin-bottom:22px">We will send a verification link to your email address.</p><div class="stack">${field('Full name','admission-name','Enter your name','text','Nisha Rao','',true)}${field('Email address','admission-email','you@example.com','email','nisha.rao@example.test','',true)}<label class="checkbox-line"><input type="checkbox" id="admission-consent" ${state.consented?'checked':''}><span>I understand that this is an AI-assisted screening interview and consent to interview transcription and evaluation for recruitment purposes. <a href="#" data-action="privacy" style="color:#285eee">Privacy details</a>.</span></label><div class="info-strip" style="margin:0">${icon('lock',16)} Your invite and verification are intended for your account only.</div>${actionBtn('Continue to email verification '+icon('arrow',16),'admission-next','btn btn-primary btn-lg')}</div><p class="help" style="margin-top:18px">This sample portal uses invented candidate details and does not send email.</p></section></div></main>`}
function screeningVerify(){return `<main class="public-content"><div class="public-narrow"><div class="public-card" style="text-align:center"><div style="width:57px;height:57px;background:#eaf1ff;color:#285eee;border-radius:17px;display:grid;place-items:center;margin:0 auto 20px">${icon('mail',29)}</div>${badge('STEP 2 OF 3','blue')}<h1 class="public-title" style="font-size:25px;margin-top:14px">Verify your email</h1><p class="public-sub">Enter the six-digit verification code for <strong>n••••@example.test</strong>. A real application would verify this against the backend and apply expiry and rate limits.</p><div class="field" style="max-width:320px;margin:25px auto 12px;text-align:left"><label for="verify-code">Verification code</label><input id="verify-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="• • • • • •" style="text-align:center;font-size:22px;letter-spacing:9px;height:60px;font-weight:760"></div><div class="help" style="margin-bottom:24px">Prototype demo code: <strong>248613</strong> (not a secure code)</div>${actionBtn('Verify and continue '+icon('arrow',16),'verify-next','btn btn-primary btn-lg')}<div class="between" style="margin-top:23px"><button data-action="resend-code" class="btn btn-quiet">${icon('refresh',14)} Resend code</button>${navBtn('Back to admission','/screening/admission','btn btn-quiet')}</div></div><div class="info-strip" style="margin-top:17px">${icon('shield',18)} Expired, reused, invalid or rate-limited codes must result in explicit states in production; never silently accept an invalid token.</div></div></main>`}
function screeningLive(){return `<main class="public-content call-view"><div class="between" style="margin-bottom:19px"><div><div class="eyebrow">${icon('headphones',14)} AI INTERVIEW / WEB CHANNEL</div><h1 class="page-title" style="font-size:25px">Full Stack Developer screening</h1><p class="page-desc">Verified candidate · Live audio desk preview</p></div>${badge(state.callEnded?'SESSION ENDED':'<span class="badge-dot"></span> Connected','green')}</div><div class="call-grid"><section class="card card-pad"><div class="between" style="margin-bottom:14px"><span class="pill">${icon('shield',13)} Candidate-only private room</span><span class="tiny muted">00:08:42 / estimated 25 min</span></div><div class="call-stage"><div class="agent-orb">AI</div><h2 style="font-size:19px;margin:16px 0 2px;letter-spacing:-.4px">Alex · AI Interviewer</h2><p class="muted tiny">${state.callEnded?'Call completed':state.micOn?'Listening and asking questions':'Your microphone is muted'}</p>${!state.callEnded?`<div class="wave" aria-label="Simulated audio visualization">${Array.from({length:22},()=>'<span></span>').join('')}</div>`:''}<p class="muted tiny" style="margin:0">AI-assisted interview · Responses may be transcribed</p><div class="call-actions"><button class="round-action ${!state.micOn?'active':''}" data-action="toggle-mic" aria-label="${state.micOn?'Mute':'Unmute'} microphone">${icon(state.micOn?'mic':'micOff',20)}</button><button class="round-action hang" data-action="end-call" aria-label="End interview">${icon('phone',20)}</button></div><span class="help" style="margin-top:12px">${state.micOn?'Mute microphone':'Unmute microphone'} &nbsp; · &nbsp; End session</span></div><div class="mini-footer"><span>${icon('wifi',13)} Simulated connection · No real audio</span><span>${icon('lock',13)} Demo privacy indicator</span></div></section><aside class="stack"><section class="card card-pad"><h3 class="card-title">Interview progress</h3><p class="card-sub">Read-only candidate context</p><div style="margin:18px 0">${progress(38)}</div><div class="between tiny"><strong>Technical background</strong>${badge('CURRENT','blue')}</div><hr class="rule"><div class="between tiny"><span>Introductions</span>${badge('Done','green')}</div><div class="between tiny" style="margin-top:14px"><span>Technical deep dive</span>${badge('In progress','blue')}</div><div class="between tiny" style="margin-top:14px"><span>Scenario discussion</span>${badge('Upcoming')}</div></section><section class="card card-pad"><h3 class="card-title">Live transcript preview</h3><p class="card-sub">Production visibility must follow consent and access rules.</p><div class="turn"><span class="avatar-small">AI</span><div class="bubble">Tell me how you would handle a slow API response in a React application.</div></div><div class="turn you"><span class="avatar-small">YOU</span><div class="bubble">I would start by measuring network timing and checking the data fetching strategy...</div></div></section><div class="info-strip">${icon('info',17)} Ensure microphone permission, reconnection, transcript accessibility, and low-bandwidth states are implemented before release.</div></aside></div></main>`}
function screeningTriage(){const s=sessions.find(x=>x.id===state.selectedScreening)||sessions[0];const list=sessions.filter(x=>((state.triageFilter==='all')||(state.triageFilter==='pending'&&!['ready','done'].includes(x.status))||(state.triageFilter===x.status))&&[x.name,x.email,x.role].join(' ').toLowerCase().includes(state.search.toLowerCase()));let ready=sessions.filter(x=>x.status==='ready');return `${header('Screening triage','Human review, supporting evidence, and accountable decisions in a single workspace.','AI Screening / Decision Desk',navBtn(icon('clipboard',14)+' Screening operations','/screening/sessions')+actionBtn(icon('download',14)+' Export demo CSV','export-triage','btn'))}
<div class="metric-grid">${metric('Total applicants',sessions.length,'Visible prototype records','users')}${metric('Ready for HR review',ready.length,'Evaluation finished','clipboard','amber')}${metric('Strong fit (AI)',ready.filter(x=>(x.score||0)>=75).length,'Recommendation only; not a decision','spark','green')}${metric('Awaiting evaluation',sessions.filter(x=>['queue','live','analysis'].includes(x.status)).length,'No scores until analysis ends','clock','purple')}</div>

<div class="grid-main-side"><section class="card" style="overflow:hidden">${state.triageView==='table'?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Candidate</th><th>Role</th><th>Channel</th><th>Score</th><th>AI result</th><th>Decision</th></tr></thead><tbody>${list.map(x=>`<tr data-action="select-screening" data-id="${x.id}" class="${s.id===x.id?'selected':''}"><td><div class="inline"><span class="avatar-small">${x.initials}</span><div><strong style="font-size:11.5px">${esc(x.name)}</strong><div class="help">${esc(x.email)}</div></div></div></td><td>${esc(x.role)}</td><td>${badge(x.channel,'blue')}</td><td>${x.score===null?`<span class="muted">Pending</span>`:`<strong class="score">${x.score}</strong>`}</td><td>${x.score===null?badge(stageName(x.status),''):badge(x.recommendation,x.score>=75?'green':'amber')}</td><td>${x.decision?badge(x.decision,x.decision==='Shortlist'?'green':x.decision==='Reject'?'red':'amber'):badge('Undecided')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="grid-2" style="padding:12px">${list.map(x=>`<button class="session-card" data-action="select-screening" data-id="${x.id}"><div class="between"><strong>${esc(x.name)}</strong>${badge(stageName(x.status),stageTone(x.status))}</div><p class="card-sub">${esc(x.role)}</p><div class="between" style="margin-top:18px"><span>${x.score===null?'Awaiting score':`Score: ${x.score}/100`}</span>${icon('arrow',15)}</div></button>`).join('')}</div>`}<div class="mini-footer" style="padding:12px 15px;margin:0;border-top:1px solid var(--border)"><span>Showing ${list.length} candidates · Sample data</span><span>1–${list.length} of ${list.length}</span></div></section>

function triageDetail(s){if(state.triageTab==='transcript')return s.score===null?`<div class="review-box"><h4>Transcript not available yet</h4><p>The transcript becomes available only after interview completion and authorized processing.</p></div>`:`<p class="mini-heading">Evidence excerpts · Demonstration</p><div class="turn"><span class="avatar-small">AI</span><div class="bubble">How would you debug an API timeout affecting a production application?</div></div><div class="turn you"><span class="avatar-small">${s.initials}</span><div class="bubble">I would reproduce and inspect traces, isolate the slow dependency, and use metrics before changing the implementation.</div></div>${navBtn('View complete scorecard '+icon('arrow',14),'/screening/scorecard','btn btn-sm')}`;
if(state.triageTab==='scorecard')return s.score===null?`<div class="review-box"><h4>No defensible score yet</h4><p>AI scoring and HR action controls remain unavailable while the interview or analysis is pending.</p></div>`:`<div class="between"><h3 class="card-title">Competency breakdown</h3>${badge('SAMPLE','blue')}</div>${scoreBars(s)}${navBtn('Review full scorecard '+icon('arrow',14),'/screening/scorecard','btn btn-sm')}`;
return `<div class="inline" style="align-items:flex-start;gap:15px">${s.score!==null?`<div class="score-ring" style="--pct:${s.score}"><div class="score-inner"><strong>${s.score}</strong><span>out of 100</span></div></div>`:`<div class="score-ring" style="--pct:0"><div class="score-inner"><strong>—</strong><span>pending</span></div></div>`}<div style="min-width:0;flex:1"><div class="mini-heading">AI RECOMMENDATION</div><div style="margin:9px 0">${s.score!==null?badge(s.recommendation,s.score>=75?'green':'amber'):badge('Not available yet')}</div><p class="card-sub">${s.score!==null?'AI output is supporting context. Final selection remains with HR.':'This candidate has not completed all required processing stages.'}</p></div></div><hr class="rule"><div class="info-tiles"><div class="info-tile"><span>ROLE</span><strong>${esc(s.role)}</strong></div><div class="info-tile"><span>CHANNEL</span><strong>${s.channel}</strong></div><div class="info-tile"><span>WORKFLOW STAGE</span><strong>${stageName(s.status)}</strong></div><div class="info-tile"><span>HUMAN DECISION</span><strong>${esc(s.decision||'Not taken')}</strong></div></div><div class="mini-tabline">Skills discussed</div><div class="tag-cloud">${s.skills.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><hr class="rule">${s.score!==null?`<div class="mini-heading">Decision actions · HR owned</div><div class="inline" style="margin-top:12px;flex-wrap:wrap">${actionBtn(icon('check',14)+' Shortlist','triage-shortlist','btn btn-green',`data-id="${s.id}"`)}${actionBtn('Hold','triage-hold','btn',`data-id="${s.id}"`)}${actionBtn('Reject','triage-reject','btn btn-danger',`data-id="${s.id}"`)}</div>${s.decision==='Shortlist'?`<div style="margin-top:11px">${actionBtn('Advance to Pre-Joining LC '+icon('arrow',14),'triage-to-lc','btn btn-primary',`data-id="${s.id}"`)}</div>`:''}`:`<div class="info-strip amber" style="margin-bottom:0">${icon('clock',16)} HR decisions are locked until evaluation completes. Use Screening Sessions to monitor progress.</div>`}</div>`}
function scoreBars(s){let n=s.score||0;return [['Technical knowledge',Math.min(97,n+4)],['Problem solving',Math.max(0,n-7)],['Communication',Math.min(96,n+2)],['Role competencies',Math.min(94,n+1)]].map(([l,v])=>`<div class="score-bar"><span>${l}</span>${progress(v)}<strong>${v}</strong></div>`).join('')}
function screeningScorecard(){const s=sessions.find(x=>x.id===state.selectedScreening)||sessions[2];return `${header('HR evaluation scorecard','An evidence-led assessment with clear separation between AI observations and HR decisions.','AI Screening / Evaluation',navBtn(icon('back',15)+' Back to triage','/screening/triage'))}
<div class="grid-main-side"><div class="stack"><section class="card card-pad"><div class="between"><div class="inline"><span class="avatar-small" style="width:48px;height:48px;font-size:14px">${s.initials}</span><div><h2 class="card-title" style="font-size:18px">${esc(s.name)}</h2><p class="card-sub">${esc(s.role)} · ${s.channel} interview</p></div></div>${badge(s.score===null?'Evaluation pending':'Ready for HR review',s.score===null?'amber':'green')}</div><hr class="rule"><div class="grid-2"><div class="review-box"><h4>AI assessment</h4><div style="display:flex;align-items:center;gap:20px;margin-top:17px">${s.score===null?`<span class="score" style="font-size:35px">—</span>`:`<span class="score" style="font-size:35px">${s.score}<small class="muted"> / 100</small></span>`}<div><b>${esc(s.recommendation||'Not ready')}</b><p class="card-sub">Recommendation only</p></div></div></div><div class="review-box"><h4>HR decision</h4><div style="margin:17px 0 12px">${badge(s.decision||'Pending human review',s.decision==='Shortlist'?'green':'amber')}</div><p>Decision owner: HR Checker / authorized reviewer</p></div></div></section>
<section class="card card-pad"><div class="card-head"><div><h2 class="card-title">Competency assessment</h2><p class="card-sub">Example scored indicators, with evidence accessible to reviewers.</p></div>${badge('SAMPLE DATA','blue')}</div>${s.score===null?`<div class="info-strip amber">${icon('clock',16)} Evaluation is still processing. Scores are intentionally hidden.</div>`:scoreBars(s)}<hr class="rule"><div class="review-box"><h4>Reviewer notes</h4><p>Assess skills against the approved role rubric. Confirm contradictory evidence, candidate context, and the reasoning before recording a final HR decision.</p><textarea id="scorecard-notes" placeholder="Record the reasoning behind your decision..." style="width:100%;margin-top:13px;border:1px solid #dfe6f1;border-radius:9px;padding:12px;min-height:85px;resize:vertical;font:inherit;font-size:12px"></textarea><div style="margin-top:12px">${actionBtn('Save draft notes','save-notes','btn btn-sm')}</div></div></section></div>

<section class="card card-pad"><div class="between" style="align-items:flex-start"><div><span class="eyebrow">LC REQUEST / ${esc(selected.id.toUpperCase())}</span><h2 class="card-title" style="font-size:20px">${esc(selected.name)}</h2><p class="card-sub">${esc(selected.role)} · ${esc(selected.team)}</p></div>${badge(requestStatus(selected.status),stageTone(selected.status))}</div><hr class="rule"><div class="step-list">${phases.map((s,i)=>`${i?'<span class="step-line"></span>':''}<span class="step ${i===step?'active':i<step?'complete':''}"><span class="num">${i<step?icon('check',13):i+1}</span>${s}</span>`).join('')}</div><hr class="rule"><div class="info-tiles"><div class="info-tile"><span>HR MAKER / AUTHOR</span><strong>${esc(selected.author)}</strong></div><div class="info-tile"><span>HR CHECKER</span><strong>${esc(selected.reviewer)}</strong></div><div class="info-tile"><span>CREATED</span><strong>${esc(selected.date)}</strong></div><div class="info-tile"><span>CANDIDATE LINK</span><strong>${selected.link?'Issued after approval':'Not issued'}</strong></div></div>
<div class="mini-tabline">Dynamic LC task sheet</div><div class="list-block">${[['01','Solution approach','Required · Text response'],['02','Technical implementation','Required · Repo or PDF attachment'],['03','Mentor discussion','Optional · Reviewer feedback']].map(([n,t,d])=>`<div class="list-row"><div class="inline"><span class="avatar-small" style="background:#f0f4fb;color:#607caa">${n}</span><div><strong style="font-size:12px">${t}</strong><div class="card-sub">${d}</div></div></div>${badge('Configured')}</div>`).join('')}</div><div class="inline" style="flex-wrap:wrap;margin-top:17px">${navBtn(icon('id',15)+' Open dossier','/prejoining/dossier','btn')}${navBtn(icon('shield',15)+' Review approvals','/prejoining/approvals','btn')}${navBtn(icon('link',15)+' Manage candidate access','/prejoining/links','btn btn-primary')}</div></section></div>

case 'personal':return `<div class="field-grid">${field('Legal full name','d-name','Full name','text','Aditi Mehra','Match official identity records.',true)}${field('Personal email','d-email','name@example.com','email','aditi.mehra@example.test','',true)}${field('Mobile number','d-phone','10-digit mobile number','tel','9876543210','Indian mobile number format (demo).',true)}${field('Date of birth','d-dob','','date','1999-08-16','',true)}${field('Current city','d-city','City','text','Coimbatore')}${fieldSelect('Employment type','d-employment',['Full-time','Internship','Contract'],'Full-time')}<div class="full">${field('Correspondence address','d-address','Address line','text','Example Street, Coimbatore')}</div></div><hr class="rule"><div class="info-strip">${icon('info',16)} Imported screening information should be labeled as extracted, candidate-confirmed, or HR-verified to avoid silent overwrites.</div>`;
case 'education':return `<div class="field-grid">${field('Highest qualification','d-qualification','e.g. B.E. Computer Science','text','B.E. Computer Science','',true)}${field('Institution','d-college','University / institution','text','Example Institute of Technology','',true)}${field('Graduation year','d-year','YYYY','number','2021','Accepted range configured by policy.',true)}${field('Percentage / CGPA','d-gpa','e.g. 8.1','text','8.1 CGPA')}${fieldSelect('Verification status','d-edu-state',['Not verified','Candidate confirmed','HR verified'],'Candidate confirmed')}${field('Certificate reference','d-cert','Reference (optional)','text')}</div><hr class="rule">${badge('Educational certificates attach under Document Vault','blue')}`;

case 'compensation':return `<div class="info-strip">${icon('info',16)} This is an illustrative salary breakup. All components, statutory deductions, and payroll rules must be verified against approved company policy.</div><div class="field-grid">${field('Fixed pay · Annual (INR)','ctc-fixed','Amount','number','720000','',true)}${field('Variable pay · Annual (INR)','ctc-variable','Amount','number','60000')}${field('Employer contributions (INR)','ctc-employer','Amount','number','36000')}${field('Other components (INR)','ctc-other','Amount','number','24000')}</div><hr class="rule"><div class="between"><div><span class="mini-heading">TOTAL ANNUAL CTC · DEMO</span><h2 style="font-size:28px;margin:7px 0 0;letter-spacing:-1px">₹8,40,000</h2></div>${badge('Awaiting HR validation','amber')}</div>`;
case 'documents':return `<div class="grid-2"><div><h3 class="card-title">Identity & statutory</h3><p class="card-sub">Upload only the documents specifically requested by HR.</p>${documentFile('Photo ID / PAN','Required · PDF / PNG / JPG')}${documentFile('Address proof','Required · PDF / PNG / JPG')}</div><div><h3 class="card-title">Education & employment</h3><p class="card-sub">Certification and employment evidence.</p>${documentFile('Degree certificate','Required · PDF / PNG / JPG')}${documentFile('Previous payslip','If applicable · PDF / PNG / JPG')}</div></div><hr class="rule"><label class="doc-upload" for="dossier-uploads">${icon('upload',23)}<strong>Choose files for local preview</strong><small>Demonstration only · Max 10 MB each · No server upload</small><input type="file" multiple id="dossier-uploads" accept=".pdf,.jpg,.jpeg,.png" style="display:none" /></label><div id="dossier-upload-names" class="help" style="margin-top:12px">Storage status: integration required — not actually encrypted or uploaded by this prototype.</div>`;
default:return ''}}

function approvals(){let chosen=lcRequests.find(x=>x.id===state.selectedLc)||lcRequests[0];return `${header('Maker / Checker approval desk','Enforce HR author preparation followed by independent HR Checker or Lead approval before any candidate dispatch.','Talent Lifecycle / Approvals',navBtn('Back to LC workspace','/prejoining/workspace'))}

isabled':'')}${actionBtn('Request changes','revise-lc','btn btn-danger',chosen.status!=='review'||state.role!=='checker'?'disabled':'')}${actionBtn('Submit author draft','submit-lc-draft','btn btn-primary',chosen.status!=='draft'||state.role!=='maker'?'disabled':'')}</div><p class="help" style="margin-top:12px">Current role: <b>${roleLabel[state.role]}</b>. Switch roles in the top-right header. The maker cannot approve their own draft.</p></div><div class="info-strip">${icon('shield',19)} A production implementation must enforce Maker/Checker segregation on the API, not just through disabled buttons.</div></section></div>`}

function rhSaveStep(){let get=(id)=>$('#'+id);let n=(id)=>Number(get(id)?.value);let read=(id)=>get(id)?.value?.trim();switch(rhWizardSteps[state.rhJobStep][0]){
 case 'title':if(get('rh-title'))rhDraft.title=read('rh-title');break;
 case 'mode':if(get('rh-city'))rhDraft.location=read('rh-city');if(get('rh-zone'))rhDraft.timezone=read('rh-zone');break;
 case 'experience':if(get('rh-exp-min'))rhDraft.min=n('rh-exp-min');if(get('rh-exp-max'))rhDraft.max=n('rh-exp-max');break;
 case 'salary':if(get('rh-salary-min'))rhDraft.salaryMin=n('rh-salary-min');if(get('rh-salary-max'))rhDraft.salaryMax=n('rh-salary-max');if(get('rh-currency'))rhDraft.currency=read('rh-currency');if(get('rh-salary-unit'))rhDraft.salaryUnit=read('rh-salary-unit');if(get('rh-strict'))rhDraft.salaryStrict=get('rh-strict').checked;break;
 case 'description':if(get('rh-description'))rhDraft.description=read('rh-description');break;
 case 'questions':rhDraft.questions.forEach(q=>{const ans=get('rh-ideal-'+q.id);if(ans)q.ideal=ans.value.trim();const must=get('rh-must-'+q.id);if(must)q.must=must.checked});break;
 }}
function rhJobValidate(){switch(rhWizardSteps[state.rhJobStep][0]){
 case 'title':return rhDraft.title.length>=3?'':'Enter a job title of at least three characters.';
 case 'mode':return rhDraft.location.length>=2?'':'Please provide the expected city or location.';
 case 'experience':return rhDraft.min>=0&&rhDraft.max<=40&&rhDraft.max>=rhDraft.min?'':'Minimum experience must not exceed maximum (0–40 years).';
 case 'skills':return rhDraft.skills.length?'':'Add at least one must-have technical skill.';
 case 'salary':return rhDraft.salaryMin>=0&&rhDraft.salaryMax>=rhDraft.salaryMin?'':'The maximum salary must be greater than or equal to the minimum.';
 case 'description':return rhDraft.description.length>=80?'':'Provide at least 80 characters of job description.';
 case 'questions':return rhDraft.questions.length?'':'Add at least one screening qualification question.';
 default:return '';
 }}

function rhStepDescription(key){return({title:'Start with a clear role name. You can refine responsibilities later.',type:'Choose the employment category candidates should be considered for.',mode:'Select work arrangement, expected location, and time-zone alignment.',experience:'Define realistic minimum and maximum experience requirements.',skills:'Add essential technologies with expected relevant experience. Tap a chip to remove.',salary:'Set the hiring budget and decide whether it is a strict eligibility filter.',locale:'Countries and communication languages are optional preferences, not automatic rejection rules.',description:'Describe the role and review a suggested rewrite before accepting any generated text.',questions:'Build structured screening criteria with ideal responses and must-have flags. Final hiring decisions remain human-led.',review:'Confirm the details and publish to this prototype’s local job list. No job goes to a live website.'})[key]}
function rhWizardBody(key){switch(key){
 case 'title':return `<div class="rh-form-max">${field('Job title','rh-title','e.g. Full Stack Developer','text',rhDraft.title,'Displayed on screening invitations, candidate records and job pages.',true)}<div class="rh-suggestion" style="margin-top:19px"><strong>${icon('spark',14)} Writing tip</strong><p>Use specific role titles rather than internal abbreviations. Avoid seniority claims that are not reflected in requirements.</p></div></div>`;
 case 'type':return `<div class="rh-form-max"><div class="rh-choice-grid">${[['Full Time','Full-time position','Permanent engagement','brief'],['Part Time','Part-time','Reduced hours','clock'],['Contract','Contract','Fixed contractual work','file'],['Temporary','Temporary','Short-term requirement','calendar'],['Internship','Internship','Student / early-career role','cap']].map(x=>rhChoice('type',...x)).join('')}</div><div class="rh-alert" style="margin-top:20px">${icon('info',16)} Employment category changes after publication should be reviewed before new invitations are sent.</div></div>`;
 case 'mode':return `<div class="rh-form-max"><h3 class="rh-section-label">Work location preference</h3><div class="rh-choice-grid">${[['Onsite','Onsite','Work at office','brief'],['Hybrid','Hybrid','Office and remote','users'],['Remote','Fully remote','Remote-first role','monitor']].map(x=>rhChoice('mode',...x)).join('')}</div><div class="field-grid" style="margin-top:19px">${field('City / location','rh-city','e.g. Coimbatore or India','text',rhDraft.location,'',true)}${fieldSelect('Preferred timezone','rh-zone',['Asia/Kolkata','Asia/Dubai','Europe/London','America/New_York'],rhDraft.timezone)}</div></div>`;
 case 'experience':return `<div class="rh-form-max"><div class="rh-exp">${field('Minimum experience · years','rh-exp-min','Min','number',String(rhDraft.min),'',true)}<span class="rh-exp-txt">to</span>${field('Maximum experience · years','rh-exp-max','Max','number',String(rhDraft.max),'',true)}</div><div class="rh-range"><span class="mini-heading">Minimum experience</span><input type="range" min="0" max="25" step="1" value="${rhDraft.min}" data-range-sync="rh-exp-min"/><div class="rh-range-labels"><span>0 years</span><span>25+ years</span></div></div><div class="rh-range"><span class="mini-heading">Maximum experience</span><input type="range" min="0" max="25" step="1" value="${rhDraft.max}" data-range-sync="rh-exp-max"/><div class="rh-range-labels"><span>0 years</span><span>25+ years</span></div></div><p class="rh-reference">Experience fields and sliders stay synchronized. Screening recommendations must not apply unstated experience cutoffs.</p></div>`;
 case 'skills':return `<div class="rh-form-max"><h3 class="rh-section-label">Must-have competencies (${rhDraft.skills.length})</h3><div class="rh-chips">${rhDraft.skills.map((s,i)=>`<button class="rh-pill-btn" data-action="rh-remove-skill" data-index="${i}" aria-label="Remove ${esc(s.name)}">${esc(s.name)} · ${s.years}y <span class="x">×</span></button>`).join('')}</div><div class="rh-input-row" style="margin-top:23px"><div class="field"><label for="rh-skill-input">Add another skill</label><input id="rh-skill-input" placeholder="e.g. PostgreSQL" /></div><div class="field" style="flex:0 0 110px;min-width:100px"><label for="rh-skill-years">Experience</label><input id="rh-skill-years" type="number" min="0" max="30" value="2" /></div>${actionBtn(icon('plus',14)+' Add skill','rh-add-skill','btn btn-primary')}</div><p class="rh-reference">Use skills that directly relate to the job and can be evaluated fairly through questions and interview evidence.</p></div>`;
 case 'salary':return `<div class="rh-form-max"><div class="rh-form-side"><div class="stack"><div class="field-grid">${fieldSelect('Currency','rh-currency',[{value:'INR',label:'Indian Rupee (₹)'},{value:'USD',label:'US Dollar ($)'},{value:'AED',label:'UAE Dirham (AED)'}],rhDraft.currency)}${fieldSelect('Period','rh-salary-unit',['year','month'],rhDraft.salaryUnit)}</div><div class="rh-exp">${field('Minimum salary','rh-salary-min','Minimum','number',String(rhDraft.salaryMin),'',true)}<span class="rh-exp-txt">to</span>${field('Maximum salary','rh-salary-max','Maximum','number',String(rhDraft.salaryMax),'',true)}</div><label class="rh-tick"><input id="rh-strict" type="checkbox" ${rhDraft.salaryStrict?'checked':''}/> Enforce this salary range as a screening rule</label></div><aside class="rh-suggestion"><strong>${icon('info',14)} Pay range context</strong><p>Reference range displayed here is illustrative, not a live market salary recommendation.</p><strong>${rhDraft.currency} ${rhDraft.salaryMin.toLocaleString('en-IN')} – ${rhDraft.salaryMax.toLocaleString('en-IN')} / ${esc(rhDraft.salaryUnit)}</strong></aside></div></div>`;
 case 'locale':return `<div class="rh-form-max"><h3 class="rh-section-label">Preferred countries (optional)</h3><div class="rh-chips">${rhDraft.countries.map((s,i)=>`<button class="rh-pill-btn" data-action="rh-remove-country" data-index="${i}">${esc(s)} <span class="x">×</span></button>`).join('')}</div><div class="rh-input-row"><div class="field"><label for="rh-country">Country</label><input id="rh-country" placeholder="Enter a country" /></div>${actionBtn(icon('plus',14)+' Add','rh-add-country','btn')}</div><h3 class="rh-section-label" style="margin-top:27px">Communication languages (optional)</h3><div class="rh-chips">${rhDraft.languages.map((s,i)=>`<button class="rh-pill-btn" data-action="rh-remove-language" data-index="${i}">${esc(s.name)} · ${esc(s.level)} <span class="x">×</span></button>`).join('')}</div><div class="rh-input-row"><div class="field"><label for="rh-language">Language</label><input id="rh-language" placeholder="e.g. English" /></div><div class="field" style="flex:0 0 148px;min-width:135px"><label for="rh-fluency">Proficiency</label><select id="rh-fluency"><option>Fluent</option><option>Professional</option><option>Conversational</option></select></div>${actionBtn('Add language','rh-add-language','btn')}</div></div>`;
 case 'description':return `<div class="rh-form-max">${rhFieldArea('Job description','rh-description',rhDraft.description,11,'Include role scope, responsibilities, required skills, and working arrangements.')}<div class="between"><span class="rh-micro">Editable content; not sent to an AI provider.</span><span class="rh-micro">${rhDraft.description.length} characters</span></div><div style="margin-top:14px">${actionBtn(icon('spark',15)+' Rewrite with AI · demo','rh-rewrite','btn')}</div>${rhDraft.rewrite?`<div class="rh-suggestion" style="margin-top:17px"><strong>Suggested rewrite · Template simulation</strong><div class="rh-doc-preview">${esc(rhDraft.rewrite)}</div><div class="rh-row" style="margin-top:13px">${actionBtn('Accept suggestion','rh-accept-rewrite','btn btn-primary btn-sm')}${actionBtn('Dismiss','rh-dismiss-rewrite','btn btn-sm')}</div></div>`:''}</div>`;
 case 'questions':return `<div class="rh-form-max"><div class="rh-alert">${icon('info',16)} Use a blend of qualification and job-related questions. Must-have rules require manual review and should not automatically reject applicants without policy approval.</div>${rhDraft.questions.map((q,i)=>`<div class="rh-question"><div class="rh-question-top"><strong>${i+1}. ${esc(q.text)}</strong><button class="icon-btn" data-action="rh-delete-wizard-question" data-id="${q.id}" aria-label="Remove question">${icon('close',13)}</button></div><div class="field-grid"><div class="field"><label for="rh-ideal-${q.id}">Ideal answer</label><input id="rh-ideal-${q.id}" value="${esc(q.ideal)}"/></div><div class="field"><label for="rh-must-${q.id}">Qualification rule</label><label class="rh-tick" style="padding:10px 0"><input id="rh-must-${q.id}" type="checkbox" ${q.must?'checked':''}/> Must-have criterion</label></div></div></div>`).join('')}<div class="rh-input-row"><div class="field"><label for="rh-question-input">New screening question</label><input id="rh-question-input" placeholder="Ask a job-related qualification question"/></div>${actionBtn(icon('plus',15)+' Add question','rh-add-wizard-question','btn btn-primary')}</div><div class="rh-row" style="margin-top:15px">${actionBtn(icon('spark',15)+' Suggest sample questions','rh-suggest-wizard-questions','btn')}${navBtn('Question bank '+icon('arrow',13),'/screening/questions','btn')}</div></div>`;
 case 'review':return `<div class="rh-form-max"><div class="rh-overview-banner" style="margin-bottom:14px"><div><span class="eyebrow">PUBLISH CHECKLIST</span><h2>${esc(rhDraft.title)}</h2><p>The role will be saved only inside this local demonstration.</p></div>${badge('Ready for human confirmation','green')}</div><div class="rh-detail"><div><label>EMPLOYMENT</label><strong>${esc(rhDraft.type)}</strong></div><div><label>WORK MODEL</label><strong>${esc(rhDraft.mode)} · ${esc(rhDraft.location)}</strong></div><div><label>EXPERIENCE</label><strong>${rhDraft.min}–${rhDraft.max} years</strong></div><div><label>SALARY RANGE</label><strong>${rhDraft.currency} ${rhDraft.salaryMin.toLocaleString('en-IN')} – ${rhDraft.salaryMax.toLocaleString('en-IN')}</strong></div><div><label>MUST-HAVE SKILLS</label><strong>${esc(rhDraft.skills.map(s=>s.name).join(', '))}</strong></div><div><label>SCREENING QUESTIONS</label><strong>${rhDraft.questions.length} drafted · ${rhDraft.questions.filter(x=>x.must).length} must-have</strong></div><div><label>COUNTRY PREFERENCES</label><strong>${esc(rhDraft.countries.join(', ')||'Any')}</strong></div><div><label>LANGUAGES</label><strong>${esc(rhDraft.languages.map(x=>x.name).join(', ')||'Any')}</strong></div></div><div class="rh-doc-preview">${esc(rhDraft.description)}</div><div class="rh-alert" style="margin-top:15px">${icon('info',15)} Publication in the production HRMS must check RBAC, required fields, job approval and business policy. This prototype does not publish to public job sites.</div></div>`;
 default:return '';
 }}

rhSaveStep=function(){vpBaseSave();vpSync();if(rhWizardSteps[state.rhJobStep]?.[0]==='questions'){rhDraft.questions.forEach(q=>{let category=$('#vp-qcat-'+q.id),weight=$('#vp-qweight-'+q.id),type=$('#vp-qtype-'+q.id),guide=$('#vp-qguide-'+q.id);if(category)q.category=category.value;if(weight)q.weight=Number(weight.value);if(type)q.type=type.value;if(guide)q.guide=guide.value})}vpStore()};
const vpBaseValidator=rhJobValidate;
rhJobValidate=function(){let key=rhWizardSteps[state.rhJobStep][0];let e=vpExtra;
switch(key){case 'requisition':if(!e.reqCode.trim()||!e.department||!e.hiringManager||!e.requestedBy||!e.targetDate||e.openings<1)return 'Complete requisition ID, department, hiring ownership, target date and a positive openings count.';break;
case 'title':if((rhDraft.title||'').length<3||!e.designation||!e.jobRole||!e.jobCode)return 'Job title, designation, job role and internal job code are required.';break;
case 'type':if(!rhDraft.type||!e.shift||!e.workingDays)return 'Choose job type, shift, and working schedule.';break;
case 'mode':if(!rhDraft.location||!e.country||!rhDraft.timezone)return 'City, country and timezone are required.';break;
case 'experience':if(rhDraft.min>rhDraft.max||e.relevantMin>rhDraft.max||!e.qualification)return 'Check total/relevant experience and education criteria.';break;
case 'skills':if(!rhDraft.skills.length)return 'Add one or more must-have skills.';break;
case 'salary':if(rhDraft.salaryMin>rhDraft.salaryMax||rhDraft.salaryMin<0||e.noticeMax<0)return 'Check salary range and maximum notice period.';break;
case 'description':if((rhDraft.description||'').length<80||!e.jobSummary)return 'Add a job summary and a job description of at least 80 characters.';break;
case 'sourcing':if(!e.sources.length)return 'Select at least one intake source.';break;
case 'screening':if(!e.screenConfig||!e.screenChannel||e.screenDuration<5||!e.screenConsent)return 'Select the screening pipeline/channel, duration and candidate consent requirement.';break;
case 'questions':if(!rhDraft.questions.length||rhDraft.questions.some(q=>!q.text||!(q.ideal||'').trim()))return 'Provide at least one question and an expected answer for every question.';break;
case 'interviews':if(!e.interviewer||!e.hrReviewer||!e.interviewRounds.length)return 'Assign interviewers, an HR reviewer and at least one interview round.';break;
case 'handoff':if(e.maker===e.checker||!e.mentor||!e.docs.length)return 'Assign different Maker and Checker owners, a mentor, and at least one document requirement.';break;
}
return vpBaseValidator()};

 if(i===1&&esJob().status!=='Published'&&d.source!=='employee')return 'Publish this job requisition before inviting external candidates.';
 if(i===4&&(d.minExp<0||d.maxExp>30||d.minExp>d.maxExp||d.minRelevant>d.maxRelevant||d.minRelevant<0))return 'Check the experience range: minimum must not exceed maximum.';
 if(i===5&&!d.skills.some(s=>s.required))return 'Add at least one must-have skill.';
 if(i===6&&(d.salaryMin<0||d.salaryMax<d.salaryMin))return 'Salary minimum must not exceed the maximum.';
 if(i===9&&(d.questions.length<3||!d.questions.some(q=>q.must)||d.questions.some(q=>!q.text.trim()||!q.ideal.trim())))return 'Add at least three complete questions and one must-have question.';
 if(i===10&&(!d.recordConsent||d.duration<5||d.passScore<0||d.passScore>100))return 'Confirm consent and check AI session settings.';
 if(i===11&&(!d.date||!d.time||(d.meetingMode==='custom'&&!/^https:\/\//i.test(d.meetingLink))))return 'Choose a schedule and a valid custom meeting URL, when needed.';
 if(i===12&&!d.agree)return 'Confirm the reviewed job and screening setup.';
 return ''}
function esSubject(){if(esDraft.source==='employee'){let e=esEmployees.find(x=>x.id===esDraft.employeeId);return {name:e?.name||'Select employee',email:e?.email||'',id:e?.id||'',type:'Internal employee'}}if(esDraft.source==='new')return{name:esDraft.candidateName||'New candidate',email:esDraft.candidateEmail||'',id:'New applicant',type:'New candidate'};let t=rhTalents.find(x=>x.id===esDraft.candidateId);return {name:t?.name||'Select candidate',email:t?.email||'',id:t?.id||'',type:'Existing candidate'}}

function esStage4(){return `<p class="es-subtitle">Reference-inspired dual range selection with direct numeric edits. The same experience values are used during matching and qualification screening.</p><div class="es-range-block"><div class="es-label">Overall experience</div><div class="es-dual-range">${esInput('Minimum years','es-minExp',esDraft.minExp,{type:'number',min:0,max:30,step:.5})}${esInput('Maximum years','es-maxExp',esDraft.maxExp,{type:'number',min:0,max:30,step:.5})}</div><div class="es-range-main"><div><input type="range" id="es-exp-min-range" aria-label="Minimum overall years" min="0" max="30" step=".5" value="${esT(esDraft.minExp)}"/><div class="es-range-labels"><span>0 years</span><span>Minimum ${esT(esDraft.minExp)}</span></div></div><div><input type="range" id="es-exp-max-range" aria-label="Maximum overall years" min="0" max="30" step=".5" value="${esT(esDraft.maxExp)}"/><div class="es-range-labels"><span>Maximum ${esT(esDraft.maxExp)}</span><span>30 years</span></div></div></div></div><div class="es-section-heading">Relevant technical experience</div><div class="es-field-grid">${esInput('Minimum relevant years','es-minRelevant',esDraft.minRelevant,{type:'number',min:0,max:30,step:.5})}${esInput('Maximum relevant years','es-maxRelevant',esDraft.maxRelevant,{type:'number',min:0,max:30,step:.5})}</div>`}

const ixStoreKey='hrpeople-interview-center-v5';
const ixReportKey='hrpeople-interview-reports-v1';
const ixDefaultSettings={candidateUrl:'',hrEmail:'recruitment@anglertechnologies.in',sender:'HR People Recruitment',organization:'ANGLER Technologies'};
let ixSettings={...ixDefaultSettings},ixReports=[],ixDecisions={},ixSelected='',ixFilter='All',ixQuery='';
function ixRead(k,fall){try{const x=JSON.parse(localStorage.getItem(k)||'null');return x==null?fall:x}catch(e){return fall}}
function ixWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function ixSave(){ixWrite(ixStoreKey,{settings:ixSettings,reports:ixReports,decisions:ixDecisions,selected:ixSelected})}
function ixId(){const b=new Uint8Array(16);(window.crypto||{}).getRandomValues?.(b);return [...b].map(x=>x.toString(16).padStart(2,'0')).join('')||'r'+Math.random().toString(36).slice(2)}
function ixPin(){const v=new Uint32Array(1);if(window.crypto?.getRandomValues)window.crypto.getRandomValues(v);else v[0]=Math.floor(Math.random()*1e8);return String(100000+v[0]%900000)}
function ixDate(ms){return new Date(Number(ms)||Date.now()).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}
function ixStatus(inv){return inv.revoked?'Revoked':Date.now()>Number(inv.expiresAt||0)?'Expired':inv.status==='Completed'?'Completed':inv.status==='Reviewed'?'Reviewed':inv.status||'Prepared'}
function ixS(x){return esT(x)}
function ixBtn(t,a,inv='',cls='btn',extra=''){return `<button class="${cls}" data-action="${a}" ${inv?'data-id="'+ixS(inv)+'"':''} ${extra}>${t}</button>`}
function ixNav(t,path,cls='btn'){return `<button class="${cls}" data-nav="${ixS(path)}">${t}</button>`}
function ixHead(title,sub,actions=''){return header(title,sub,'Interview & e-Screening',actions)}
function ixEncode(p){const bytes=new TextEncoder().encode(JSON.stringify(p));let s='';for(const v of bytes)s+=String.fromCharCode(v);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'')}
function ixDefaultInvite(inv){
  if(!inv.token)inv.token=ixId();
  if(!inv.accessCode)inv.accessCode=ixPin();
  if(!inv.createdAt)inv.createdAt=Date.now();
  if(!inv.expiresAt)inv.expiresAt=inv.createdAt+48*3600000;
  if(!inv.questions||inv.questions.length===0){let d=esDefault();inv.questions=d.questions.map((q,i)=>({...q,category:i===0?'Experience':i===1?'Technical':'Work preferences'}));}
  if(!inv.duration)inv.duration=25;
  if(!inv.timezone)inv.timezone='Asia/Kolkata';

  if(!inv.interviewType)inv.interviewType='Online interview';
  if(!inv.participantType)inv.participantType=inv.employeeId?'employee':'candidate';
  return inv;
}
function ixCleanQuestions(input){return(input||[]).filter(q=>String(q.text||'').trim()).slice(0,14).map((q,i)=>({text:String(q.text).trim(),ideal:String(q.ideal||'').trim(),must:!!q.must,category:q.category||(['Experience','Technical','Work preferences'][i%3])}));}
function ixPayload(inv){ixDefaultInvite(inv);let qs=ixCleanQuestions(inv.questions);if(qs.length<3){qs.push({text:'Describe a recent project and your role in its delivery.',ideal:'Clearly explains responsibilities and project outcomes',must:false,category:'Practical experience'});qs.push({text:'How do you prioritize tasks when several deadlines compete?',ideal:'Prioritization and communication',must:false,category:'Problem solving'});}return{schema:'hrpeople-invitation-v1',token:inv.token,ref:inv.ref,name:inv.name,email:inv.email,role:inv.role,organization:ixSettings.organization,hrEmail:ixSettings.hrEmail,jobId:inv.jobId,candidateId:inv.candidateId||null,employeeId:inv.employeeId||null,participantType:inv.participantType,accessCode:inv.accessCode,interviewType:inv.interviewType,date:inv.date,time:inv.time,timezone:inv.timezone,duration:Number(inv.duration)||25,expiresAt:Number(inv.expiresAt),questions:qs};}
function ixLocalCandidateUrl(){const u=new URL(location.href);u.search='';u.hash='';u.pathname=u.pathname.replace(/[^/]*$/,'candidate.html');return u.toString()}
function ixBaseUrl(){let s=ixSettings.candidateUrl.trim();return s||ixLocalCandidateUrl()}
function ixPublishedUrl(){return /^https:\/\//i.test(ixBaseUrl())||/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//i.test(ixBaseUrl())}
function ixUrl(inv){return ixBaseUrl().split('#')[0]+'#invite='+ixEncode(ixPayload(inv))}
function ixMailBody(inv){return `Hello ${inv.name},\n\nYou are invited to an interview for ${inv.role} with ${ixSettings.organization}.\n\nInterview date: ${inv.date||'See invitation'} ${inv.time||''} (${inv.timezone||'Asia/Kolkata'})\nDuration: ${inv.duration||25} minutes\n\nOpen your interview:\n${ixPublishedUrl()?ixUrl(inv):'[Interview page is attached to this message]'}\n\nYour six-digit access code: ${inv.accessCode}\nInvitation expiry: ${ixDate(inv.expiresAt)}\n\nPlease use Chrome or Edge, find a quiet location and allow audio if you want to speak your answers. Typed responses are also supported.\n\nRegards,\n${ixSettings.sender}\n${ixSettings.hrEmail}`}

function ixCandidateSource(inv){const bytes=Uint8Array.from(atob(ixCandidateHtmlBase64),v=>v.charCodeAt(0));let src=new TextDecoder().decode(bytes);const p=JSON.stringify(ixPayload(inv)).replace(/</g,'\\u003c');return src.replace('<script>', '<script>window.__EMBEDDED_INVITE__='+p+';<\/script><script>')}
function ixDownloadCandidate(inv){const src=ixCandidateSource(inv);ixDownload(src,'Interview_'+inv.ref.replace(/[^a-z0-9-]/gi,'_')+'.html','text/html;charset=utf-8')}
function ixOpenCandidate(inv){const text=ixCandidateSource(inv),url=URL.createObjectURL(new Blob([text],{type:'text/html'}));let w=window.open(url,'_blank');if(!w){toast('Allow pop-ups to open the interview page, or download the interview file.')}setTimeout(()=>URL.revokeObjectURL(url),150000)}
async function ixCopy(txt,what='Copied'){try{await navigator.clipboard.writeText(txt);toast(what);return}catch(e){try{let a=document.createElement('textarea');a.value=txt;a.style.position='fixed';a.style.top='-999px';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast(what);return}catch(x){}}setModal('Copy invitation','Select and copy the content below',`<textarea class="ix-input ix-textarea" style="height:160px">${ixS(txt)}</textarea>`,ixBtn('Close','close-modal'))}
function ixInviteById(id){return esInvites.find(x=>x.ref===id)||null}
function ixSaveAll(){esSave();vpStore();ixSave()}
function ixPopulate(){if(esInvites.length===0){let a=rhTalents.find(x=>x.id==='t-01'),b=rhTalents.find(x=>x.id==='t-04');if(a){let row={ref:'ES-382715',sessionId:'s-3',candidateId:a.id,name:a.name,email:a.email,type:'External candidate',role:a.role,channel:'Web',date:'2026-10-20',time:'11:30',status:'Prepared',source:'candidate',jobId:a.job};ixDefaultInvite(row);row.questions=[{text:'Describe a React feature you delivered and the impact it had.',ideal:'React, component design and practical delivery',must:true,category:'Technical'},{text:'How do you investigate a performance problem in a web application?',ideal:'Profiling and a measurable solution',must:true,category:'Problem solving'},{text:'Describe how you communicate scope or delivery risks.',ideal:'Clear collaboration and ownership',must:false,category:'Communication'}];esInvites.unshift(row)}if(b){let row={ref:'ES-382716',sessionId:'s-4',candidateId:b.id,name:b.name,email:b.email,type:'External candidate',role:b.role,channel:'Web',date:'2026-10-22',time:'14:00',status:'Prepared',source:'candidate',jobId:b.job};ixDefaultInvite(row);esInvites.unshift(row)}esSave();}
for(const inv of esInvites)ixDefaultInvite(inv);ixSelected=ixSelected&&ixInviteById(ixSelected)?ixSelected:esInvites[0]?.ref||'';esSave()}
const ixLocal=ixRead(ixStoreKey,{});ixSettings={...ixDefaultSettings,...ixLocal.settings};ixReports=Array.isArray(ixLocal.reports)?ixLocal.reports:[];ixDecisions=ixLocal.decisions&&typeof ixLocal.decisions==='object'?ixLocal.decisions:{};ixSelected=ixLocal.selected||'';ixPopulate();
function ixAcceptReport(file,quiet=false){if(!file||file.schema!=='hrpeople-interview-result-v1'||!Array.isArray(file.answers)||file.answers.length>30||file.answers.some(a=>String(a.answer||'').length>12000))return {ok:false,message:'The selected file is not a supported interview report.'};let inv=ixInviteById(file.reference);if(!inv)return{ok:false,message:'The report reference was not found in invitations.'};if(inv.token!==file.token)return{ok:false,message:'The report does not match the current invitation token.'};if(inv.revoked)return{ok:false,message:'This invitation was revoked. Contact the coordinator.'};const idx=ixReports.findIndex(x=>x.reference===file.reference&&x.token===file.token);if(idx<0)ixReports.unshift(file);else ixReports[idx]=file;inv.status=ixDecisions[file.reference]?'Reviewed':'Completed';inv.completedAt=file.completedAt;let sess=sessions.find(s=>s.id===inv.sessionId);if(sess){sess.status='ready';sess.when='Interview completed · '+ixDate(new Date(file.completedAt).getTime());sess.score=null;sess.recommendation='Awaiting HR evaluation';sess.transcript=file.answers.map(a=>'Q: '+a.text+'\nA: '+a.answer).join('\n\n');}
if(!quiet)esActivity('Interview responses received',file.reference+' · '+file.name);ixSaveAll();return{ok:true,message:'Interview responses added to HR review.'}}
function ixSyncReports(){const items=ixRead(ixReportKey,[]);if(!Array.isArray(items))return;for(let file of items){if(!ixReports.some(x=>x.reference===file.reference&&x.token===file.token))ixAcceptReport(file,true)}}
function ixMetric(){const invited=esInvites.filter(v=>['Sent','Composed','Prepared','Invited'].includes(ixStatus(v))).length,completed=ixReports.length,reviewed=Object.keys(ixDecisions).length;return `<div class="ix-kpirow"><div class="ix-kpi"><span>All invitations</span><b>${esInvites.length}</b><small class="ix-sub">Interview links created</small></div><div class="ix-kpi"><span>Awaiting interview</span><b>${invited}</b><small class="ix-sub">Prepared or contacted</small></div><div class="ix-kpi"><span>Responses received</span><b>${completed}</b><small class="ix-sub">Completed interview records</small></div><div class="ix-kpi"><span>HR decisions</span><b>${reviewed}</b><small class="ix-sub">Recorded by reviewer</small></div></div>`}
function ixHome(){ixSyncReports();const latest=esInvites.slice(0,4);return `${ixHead('Interview & e-Screening','Prepare invitations, interview candidates, review responses and advance people through HR People.',ixNav('Screening sessions','/screening/sessions'))}<section class="ix-hero"><div><span class="eyebrow">HR PEOPLE · INTERVIEW OPERATIONS</span><h2>One interview journey, two ways to begin</h2><p>Reuse an employee master record for internal assessment or configure a role-based screening for an applicant. Invitations, candidate responses and HR decisions remain connected.</p></div>${ixNav('Create screening →','/interviews/new','btn btn-primary')}</section>${ixMetric()}<div class="ix-cards"><section class="card ix-card"><span class="ix-label">01 · RECRUITMENT</span><h3>Create e-Screening</h3><p>Set job, location, experience, skills, pay, communication, interview questions and booking.</p>${ixBtn('Start 13-step wizard →','es-start-screen','','btn btn-primary')}</section><section class="card ix-card"><span class="ix-label">02 · EMPLOYEE RECORDS</span><h3>Existing employee</h3><p>Find an employee by name or code, add a company assignment and begin an internal review.</p>${ixNav('Open employee directory →','/interviews/employees','btn btn-primary')}</section><section class="card ix-card"><span class="ix-label">03 · CANDIDATE EXPERIENCE</span><h3>Interview invitations</h3><p>Share personalized interview access, prepare email invitations, preview interviews and receive responses.</p>${ixNav('Manage invitations →','/interviews/invitations','btn btn-primary')}</section></div><div class="ix-details"><section class="ix-panel"><h3>Linked workspaces</h3><div class="ix-recent">${[['Job openings','/screening/jobs'],['Talent pool','/screening/talent'],['Hiring pipeline','/screening/pipeline'],['Question bank','/screening/questions'],['Screening configurations','/screening/configs'],['HR triage','/screening/triage'],['Offer approvals','/recruitment/offers'],['Pre-Joining LC','/p cted</button><button class="btn" data-action="ix-decide" data-id="${ixS(active.reference)}" data-value="Follow-up">Request follow-up</button>${ixBtn('Export report','ix-export-report',active.reference)}${inv?.participantType==='employee'?ixNav('Employee records','/interviews/employees'):ixNav('Offers / Pre-Joining','/recruitment/offers')}</div></section></div>`:`<section class="ix-panel ix-empty"><h3>No completed interviews have been received</h3><p>Open an interview from the invitation register or import a completed interview report from another device.</p><div class="ix-actions" style="justify-content:center">${ixNav('Open invitations','/interviews/invitations','btn btn-primary')}${ixBtn('Import report','ix-import-trigger')}</div></section>`}`}

function ixAction(name,el){let inv=ixInviteById(el.dataset.id);switch(name){
 case 'ix-select':ixSelected=el.dataset.id;ixSave();go('/interviews/invitations');break;
 case 'ix-select-candidate':ixSelected=el.dataset.id;ixSave();render();break;
 case 'ix-open':if(!inv)return;ixOpenCandidate(inv);break;

 case 'ix-reissue-confirm':if(!inv)return;inv.revoked=false;inv.token=ixId();inv.accessCode=ixPin();inv.createdAt=Date.now();inv.expiresAt=Date.now()+48*3600000;inv.status='Prepared';delete ixDecisions[inv.ref];ixReports=ixReports.filter(r=>r.reference!==inv.ref);ixSaveAll();closeModal();render();toast('New access issued.');break;
 case 'ix-revoke':if(!inv)return;inv.revoked=true;inv.status='Revoked';ixSaveAll();render();toast('Invitation revoked in HR People.');break;
 case 'ix-result':ixSelected=el.dataset.id;ixSave();go('/interviews/results');break;
 case 'ix-settings-save':{let candidateUrl=String(document.getElementById('ix-public-url')?.value||'').trim(),h=document.getElementById('ix-hr-email')?.value.trim();if(candidateUrl&&!/^https:\/\/[^/]+/i.test(candidateUrl)&&!/^http:\/\/(localhost|127\.0\.0\.1)/i.test(candidateUrl)){toast('Enter a public HTTPS interview URL or a localhost address.');return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(h||'')){toast('Enter a valid recruitment email address.');return}ixSettings={candidateUrl,hrEmail:h,organization:document.getElementById('ix-org').value.trim()||'HR People',sender:document.getElementById('ix-sender').value.trim()||'Recruitment Team'};ixSave();render();toast('Delivery settings saved.');break}
 case 'ix-select-report':ixSelected=el.dataset.id;ixSave();render();break;

 case 'ix-export-report':{let r=ixReportFor(el.dataset.id);if(r)ixDownload(JSON.stringify(r,null,2),'Interview_'+r.reference+'.json');break}
 case 'ix-decide':{let r=ixReportFor(el.dataset.id),i=ixInviteById(el.dataset.id);if(!r||!i)return;if(state.role==='vp'){toast('HR Reviewer must record the decision. Switch to HR Maker or HR Checker.');return}let t=Number(document.getElementById('ix-score-tech')?.value),c=Number(document.getElementById('ix-score-comm')?.value),n=document.getElementById('ix-review-notes')?.value.trim()||'';if(!Number.isFinite(t)||!Number.isFinite(c)||t<0||t>100||c<0||c>100||document.getElementById('ix-score-tech')?.value===''||document.getElementById('ix-score-comm')?.value===''){toast('Enter technical and communication review scores from 0 to 100.');return}if(n.length<15){toast('Enter at least 15 characters of job-related evidence.');return}const decision=el.dataset.value||'Hold';ixDecisions[r.reference]={action:decision,technical:t,communication:c,notes:n,reviewer:state.role==='maker'?'HR Maker':'HR Checker',at:Date.now()};i.status='Reviewed';if(i.candidateId){let person=rhTalents.find(x=>x.id===i.candidateId);if(person){if(decision==='Shortlist')person.stage='shortlisted';else if(decision==='Reject')person.stage='rejected';else if(decision==='Hold')person.stage='screening';vpActivity(person.id,'Interview reviewed',decision+' · '+n)}}let sess=sessions.find(s=>s.id===i.sessionId);if(sess){sess.status='done';sess.score=Math.round((t+c)/2);sess.recommendation=decision+' · HR decision'}esActivity('HR decision recorded',i.ref+' · '+decision);ixSaveAll();render();toast('HR decision recorded.');break}
 default:toast('The action is not available.');}}
document.addEventListener('change',e=>{const x=e.target;if(x.id==='ix-import-file'){ixReportImport(x.files?.[0]);x.value=''}else if(x.id==='ix-status-filter'){ixFilter=x.value;render()} });
document.addEventListener('input',e=>{if(e.target.id==='ix-search'){ixQuery=e.target.value;let pos=e.target.selectionStart;render();let inp=document.getElementById('ix-search');if(inp){inp.focus();inp.setSelectionRange(pos,pos)}}});
window.addEventListener('storage',e=>{if(e.key===ixReportKey){const count=ixReports.length;ixSyncReports();if(ixReports.length!==count&&getRoute().startsWith('/interviews'))render()}});
/* Product-facing terminology never identifies the application as a mockup. */
const ixPlainText=s=>String(s).replace(/\binteractive\s+prototype\b/gi,'workspace').replace(/\bprototype\b/gi,'workspace').replace(/\bvisual\s+VP\b/gi,'workspace').replace(/\boffline\s+interactive\s+VP\b/gi,'Workspace ready').replace(/\bVP\s*4\.0\b/gi,'').replace(/\bdemo\b/gi,'workspace').replace(/\bsimulat(?:ion|ed|e|ing)\b/gi,'interactive').replace(/\bno real\b/gi,'No external').replace(/\bno actual\b/gi,'No external');
function ixCleanDom(node){if(!node||node.nodeType!==1)return;const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let n;while((n=walker.nextNode())){if(n.parentElement?.closest('script,style,textarea'))continue;let s=ixPlainText(n.nodeValue);if(s!==n.nodeValue)n.nodeValue=s;}for(const el of node.querySelectorAll('[title],[aria-label],[placeholder]')){for(const k of ['title','aria-label','placeholder'])if(el.hasAttribute(k)){let v=ixPlainText(el.getAttribute(k));if(v!==el.getAttribute(k))el.setAttribute(k,v)}}}
const ixPrevRender=render;render=function(){ixPrevRender();document.title=(routeTitles[getRoute()]||'Interview Center')+' | HR People';ixCleanDom(document.getElementById('app'))};
const ixPrevToast=toast;toast=function(s){ixPrevToast(ixPlainText(s))};
const ixPrevModal=setModal;setModal=function(a,b,c,d=''){ixPrevModal(ixPlainText(a),ixPlainText(b),c,d);ixCleanDom(document.getElementById('modal-root'))};
if(document.querySelector('meta[name=description]'))document.querySelector('meta[name=description]').setAttribute('content','HR People interview operations, candidate invitations, assessment and pre-joining.');
render();
})();

</script>
